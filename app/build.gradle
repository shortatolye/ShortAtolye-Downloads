plugins { id 'com.android.application' }

android {
    namespace 'com.shortatolye.gokyuzuharitam'
    compileSdk 34

    defaultConfig {
        applicationId 'com.shortatolye.gokyuzuharitam'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    // Kisisel kullanim icin imza anahtari (sifresi herkese acik; Play Store icin ayri, gizli anahtar olusturulmali)
    signingConfigs {
        release {
            storeFile file('../keystore/gokyuzu-kisisel.keystore')
            storePassword 'gokyuzu123'
            keyAlias 'gokyuzu'
            keyPassword 'gokyuzu123'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
